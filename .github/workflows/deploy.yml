name: Deploy platform to shared VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: wherebear-prod-20260902
  VM: wherebear-vm
  ZONE: northamerica-northeast2-b

jobs:
  deploy:
    # Dispatching an arbitrary branch must not publish production code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      DOCKER_BUILD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_URL: https://www.whataisle.com
      NEXT_PUBLIC_ROOT_DOMAIN: whataisle.com
      NEXT_PUBLIC_PAYMENT_PROVIDER: stripe
      NEXT_PUBLIC_STRIPE_PRICE_MONTHLY: ${{ vars.NEXT_PUBLIC_STRIPE_PRICE_MONTHLY }}
      NEXT_PUBLIC_STRIPE_PRICE_YEARLY: ${{ vars.NEXT_PUBLIC_STRIPE_PRICE_YEARLY }}
      NEXT_PUBLIC_STRIPE_PRICE_LIFETIME: ${{ vars.NEXT_PUBLIC_STRIPE_PRICE_LIFETIME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - run: pnpm install --frozen-lockfile
      - name: Validate production build boundary
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_STRIPE_PRICE_LIFETIME"
          test -z "$(find . -maxdepth 1 -name '.env*' -print -quit)"
          # Startup hooks need side-effect review before production credentials.
          test -z "$(find src -maxdepth 1 -name 'instrumentation.*' -print -quit)"
          test -z "$(find . -maxdepth 1 -name 'instrumentation.*' -print -quit)"
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package standalone runtime (no runtime secrets)
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          cp -a .next/standalone/. "$stage/"
          cp -a public "$stage/public"
          cp -a .next/static "$stage/.next/static"
          test -z "$(find "$stage" -name '.env*' -print -quit)"
          test ! -e "$stage/apps"
          test -f "$stage/server.js"
          test -f "$stage/.next/BUILD_ID"
          # Operator approves schema compatibility separately; never db:migrate.
          git ls-files -z src/db | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1 > "$stage/schema.sha256"
          tar -czf "platform-${GITHUB_SHA}.tgz" -C "$stage" .
          sha256sum "platform-${GITHUB_SHA}.tgz" > "platform-${GITHUB_SHA}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ github.sha }}
          retention-days: 7
          path: |
            platform-${{ github.sha }}.tgz
            platform-${{ github.sha }}.sha256
      # Auth only after packaging: generated credentials cannot enter artifact.
      # These secrets must target the NEW project's WIF and service account.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Upload and activate platform only
        timeout-minutes: 10
        run: |
          set -euo pipefail
          key_dir=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N '' -f "$key_dir/id"
          common=(--project="$PROJECT_ID" --zone="$ZONE" --ssh-key-file="$key_dir/id" --tunnel-through-iap --quiet)
          remote_dir="/home/mystery/platform-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute ssh "mystery@$VM" "${common[@]}" --ssh-key-expire-after=15m \
            --command="umask 077; mkdir '$remote_dir'"
          gcloud compute scp "${common[@]}" "platform-${GITHUB_SHA}.tgz" \
            infra/vm/prepare-platform-release.sh infra/vm/activate-platform-release.sh \
            "mystery@$VM:$remote_dir/"
          digest=$(cut -d ' ' -f 1 "platform-${GITHUB_SHA}.sha256")
          gcloud compute ssh "mystery@$VM" "${common[@]}" --ssh-key-expire-after=15m \
            --command="sudo bash '$remote_dir/prepare-platform-release.sh' '$GITHUB_SHA' '$remote_dir/platform-${GITHUB_SHA}.tgz' '$digest' && sudo bash '$remote_dir/activate-platform-release.sh' '$GITHUB_SHA'"
          # Ephemeral runner key is never a repository secret or artifact.
      - name: Public read-only check
        run: |
          curl --fail --silent --show-error --max-time 20 https://www.whataisle.com/api/ping
          # Availability only, not database/business acceptance.
